services:
  app:
    image: php:8.4-alpine
    container_name: bible-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=3000"]
    ports:
      - "3050:3000"
    networks:
      - thinktank_net

networks:
  thinktank_net:
    name: thinktank-os_default
    external: true
